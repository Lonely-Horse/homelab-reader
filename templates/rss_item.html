<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 防首屏闪白：CSS 加载前同步应用已存主题 -->
<script>
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('hl_theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}
</script>
<title>文章 · homelab-reader</title>
<link rel="stylesheet" href="/templates/app.css">
</head>
<body>

<!-- ===== 灵动岛导航 ===== -->
<nav class="nav">
  <a class="brand" href="/dashboard"><span class="dot"></span>Reader</a>
  <button class="nav-toggle" id="navToggle" aria-label="菜单" aria-expanded="false">☰</button>
  <div class="nav-links">
    <a class="nav-link" data-view="overview" href="/dashboard">概览</a>
    <a class="nav-link active" data-view="rss" href="/dashboard/rss">资讯</a>
    <a class="nav-link" data-view="shelf" href="/dashboard/books">书架</a>
    <a class="nav-link" data-view="profile" href="/dashboard/user">我的</a>
  </div>
  <div class="nav-right">
    <div id="navRight"></div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">☾</button>
  </div>
</nav>

<main class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:14px;">
    <button class="btn btn-ghost" id="btnBack">← 返回资讯</button>
  </div>

  <article class="panel" id="itemWrap" style="padding:clamp(18px, 2.6vw, 30px);">
    <h1 id="itemTitle" style="font-size:clamp(20px, 3vw, 26px);margin-bottom:8px;color:var(--text-primary);"></h1>
    <div id="itemMeta" style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;font-family:var(--font-sans);"></div>
    <div id="itemDesc" style="font-size:15px;line-height:1.7;color:var(--text-primary);overflow-wrap:break-word;"></div>
    <div style="margin-top:24px;">
      <a id="itemLink" href="#" target="_blank" rel="noopener" class="btn btn-primary" style="display:inline-block;text-decoration:none;">前往原文 ↗</a>
    </div>
  </article>
</main>

<!-- ===== 登录/注册弹窗 ===== -->
<div class="mask" id="authMask">
  <div class="modal">
    <button class="x" id="closeAuth">✕</button>
    <h2 id="modalTitle">登录</h2>
    <div class="tabs">
      <button id="tabLogin" class="active">登录</button>
      <button id="tabRegister">注册</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field"><label>用户名</label><input id="username" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit" id="submitBtn">登 录</button>
    </form>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<script src="/templates/app.js"></script>
<script>
/* ---------------- 清洗 RSS description（非线性HTML，仅安全白名单） ---------------- */
function sanitizeRss(html) {
  if (!html) return '';
  const div = document.createElement('div');
  div.innerHTML = String(html);
  // 移除 script / iframe / img / form / 事件属性，仅保留段落与链接等
  div.querySelectorAll('script,style,iframe,form,object,embed,img').forEach(n => n.remove());
  div.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      const k = a.name.toLowerCase();
      if (k.startsWith('on')) { n.removeAttribute(a.name); }
      if (n.tagName === 'A' && a.name.toLowerCase() === 'href') { /* 保留 href */ }
    });
  });
  return div.innerHTML.trim();
}

/* ---------------- 从 localStorage 恢复条目并渲染 ---------------- */
function renderItem() {
  const t = document.getElementById('itemTitle');
  const m = document.getElementById('itemMeta');
  const d = document.getElementById('itemDesc');
  const l = document.getElementById('itemLink');
  let item = null;
  try { item = JSON.parse(localStorage.getItem('hl_rss_item') || 'null'); } catch (e) { item = null; }

  if (!item || !item.url) {
    t.textContent = '未找到该文章';
    m.textContent = '可能是临时链接，请返回资讯页重新打开。';
    d.textContent = '';
    l.style.display = 'none';
    return;
  }
  t.textContent = item.title || '标题';
  m.textContent = item.pub_date || '';
  d.innerHTML = sanitizeRss(item.description || '<p>（此源未提供正文摘要）</p>');
  l.href = item.url;
  l.textContent = '前往原文 ↗';
}

document.addEventListener('DOMContentLoaded', () => {
  initNav();
  renderItem();
  document.getElementById('btnBack').addEventListener('click', () => {
    history.length > 1 ? history.back() : (location.href = '/dashboard/rss');
  });
});
</script>
</body>
</html>
