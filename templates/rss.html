<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 防首屏闪白：CSS 加载前同步应用已存主题 -->
<script>
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('hl_theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}
</script>
<title>资讯 · homelab-reader</title>
<link rel="stylesheet" href="/templates/app.css">
</head>
<body>

<!-- ===== 灵动岛导航 ===== -->
<nav class="nav">
  <a class="brand" href="/dashboard"><span class="dot"></span>homelab<span>-reader</span></a>
  <div class="nav-links">
    <a class="nav-link" data-view="overview" href="/dashboard">概览</a>
    <a class="nav-link active" data-view="rss" href="/dashboard/rss">资讯</a>
    <a class="nav-link" data-view="shelf" href="/dashboard/books">书架</a>
    <a class="nav-link" data-view="profile" href="/dashboard/user">我的</a>
  </div>
  <div class="nav-right">
    <div id="navRight"></div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">☾</button>
  </div>
</nav>

<main class="page">
  <div class="page-head">
    <div class="page-title">RSS 资讯</div>
    <div class="page-sub">订阅的资讯源 (rss_feeds)</div>
  </div>

  <div class="grid grid-auto" id="rssList"></div>
  <div class="empty" id="rssEmpty" style="display:none;"><div class="big">📰</div><p></p></div>
</main>

<!-- ===== 登录/注册弹窗 ===== -->
<div class="mask" id="authMask">
  <div class="modal">
    <button class="x" id="closeAuth">✕</button>
    <h2 id="modalTitle">登录</h2>
    <div class="tabs">
      <button id="tabLogin" class="active">登录</button>
      <button id="tabRegister">注册</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field"><label>用户名</label><input id="username" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit" id="submitBtn">登 录</button>
    </form>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<script src="/templates/app.js"></script>
<script>
  async function loadRss() {
    const wrap = document.getElementById('rssList');
    const empty = document.getElementById('rssEmpty');
    try {
      const r = await jfetch(API.rss);
      if (!r.ok) {
        wrap.innerHTML = '';
        empty.style.display = 'block';
        empty.innerHTML = '<div class="big">🔒</div><p>请先登录查看资讯</p>';
        return;
      }
      const feeds = Array.isArray(r.body) ? r.body : [];
      if (feeds.length === 0) {
        wrap.innerHTML = '';
        empty.style.display = 'block';
        empty.innerHTML = '<div class="big">📰</div><p>还没有订阅源</p>';
        return;
      }
      empty.style.display = 'none';
      wrap.innerHTML = feeds.map(f => `
        <div class="feed-card">
          <div class="tag feed-cat">${escapeHtml(f.category || '未分类')}</div>
          <div class="feed-title">${escapeHtml(f.title)}</div>
          <a class="feed-link" href="${escapeHtml(f.url)}" target="_blank" rel="noopener">${escapeHtml(f.url)}</a>
        </div>`).join('');
    } catch (e) { empty.style.display = 'block'; empty.innerHTML = '<div class="big">⚠️</div><p>加载失败</p>'; }
  }

  document.addEventListener('DOMContentLoaded', () => { initAuth(() => loadRss()); loadRss(); });
</script>
</body>
</html>
