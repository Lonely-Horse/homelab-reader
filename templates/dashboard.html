<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 防首屏闪白：CSS 加载前同步应用已存主题 -->
<script>
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('hl_theme') === 'dark' ? 'dark' : 'light'); } catch (e) {}
</script>
<title>概览 · homelab-reader</title>
<link rel="stylesheet" href="/templates/app.css">
</head>
<body>

<!-- ===== 灵动岛导航 ===== -->
<nav class="nav">
  <a class="brand" href="/dashboard"><span class="dot"></span>homelab<span>-reader</span></a>
  <div class="nav-links">
    <a class="nav-link active" data-view="overview" href="/dashboard">概览</a>
    <a class="nav-link" data-view="rss" href="/dashboard/rss">资讯</a>
    <a class="nav-link" data-view="shelf" href="/dashboard/books">书架</a>
    <a class="nav-link" data-view="profile" href="/dashboard/user">我的</a>
  </div>
  <div class="nav-right">
    <div id="navRight"></div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">☾</button>
  </div>
</nav>

<main class="page">
  <div class="welcome">
    <h2 id="welcomeTitle">欢迎回来 👋</h2>
    <p id="welcomeSub">登录后查看你的书房概况…</p>
  </div>

  <div class="grid grid-3" id="stats" style="margin-bottom:22px;">
    <div class="stat"><h3>书架藏书</h3><div class="num" id="statBooks">–</div></div>
    <div class="stat"><h3>RSS 订阅</h3><div class="num" id="statRss">–</div></div>
    <div class="stat"><h3>当前用户</h3><div class="num" id="statUser" style="font-size:22px;white-space:nowrap;">未登录</div></div>
  </div>

  <div class="panel">
    <h3 style="margin-bottom:10px;">关于本应用</h3>
    <blockquote>homelab-reader 运行于你的 homelab，数据与书籍完全自主掌控。使用 Go 标准库 + SQLite 构建，支持白天 / 黑夜阅读模式。</blockquote>
  </div>
</main>

<!-- ===== 登录/注册弹窗 ===== -->
<div class="mask" id="authMask">
  <div class="modal">
    <button class="x" id="closeAuth">✕</button>
    <h2 id="modalTitle">登录</h2>
    <div class="tabs">
      <button id="tabLogin" class="active">登录</button>
      <button id="tabRegister">注册</button>
    </div>
    <form id="authForm" novalidate>
      <div class="field"><label>用户名</label><input id="username" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit" id="submitBtn">登 录</button>
    </form>
    <div class="msg" id="authMsg"></div>
  </div>
</div>

<script src="/templates/app.js"></script>
<script>
  async function loadOverview() {
    const books = await jfetch(API.books);
    const rss = await jfetch(API.rss);
    const bc = books.ok && Array.isArray(books.body) ? books.body.length : '–';
    const rc = rss.ok && Array.isArray(rss.body) ? rss.body.length : '–';
    document.getElementById('statBooks').textContent = bc;
    document.getElementById('statRss').textContent = rc;
    const name = getStoredUsername();
    const welcome = document.getElementById('welcomeTitle');
    const sub = document.getElementById('welcomeSub');
    if (name) {
      welcome.textContent = '欢迎回来，' + name + ' 👋';
      sub.textContent = `你的书房共有 ${bc === '–' ? 0 : bc} 本书、${rc === '–' ? 0 : rc} 个订阅源。`;
      document.getElementById('statUser').textContent = name;
    } else {
      welcome.textContent = '欢迎使用 homelab-reader 👋';
      sub.textContent = '登录后即可管理书架与订阅。';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initAuth(() => loadOverview());
    loadOverview();
  });
</script>
</body>
</html>
